each garment."],["What to Do Immediately After a Stain","Fabric Care & Stain Removal","stain-first-aid","Act quickly, but resist the urge to rub. Blot excess liquid with a clean cloth and check the garment's care instructions before applying water.","Different stains require different treatments. Heat can permanently set some stains. Tell your cleaner what caused the mark and which home treatments you already tried."],["How Often Should You Dry Clean a Suit?","Professional Dry Cleaning","suit-cleaning-frequency","Suits do not necessarily need dry cleaning after every wear. Airing, gentle brushing and prompt attention to spills can help preserve fabric.","Cleaning frequency depends on use, perspiration, visible soiling and the manufacturer's instructions. Overcleaning may shorten the life of some fabrics."],["Caring for Lace and Aso-Oke","Professional Dry Cleaning","lace-aso-oke-care","Nigerian occasion wear deserves fabric-specific care, particularly when beads, metallic threads or layered fabrics are involved.","Check embellishments before treatment, avoid wringing and store pieces in a dry, ventilated place. Ask for an assessment before attempting stain removal."],["Duvet and Bedding Care Guide","Laundry & Lifestyle","duvet-bedding-care","Clean bedding supports a comfortable home, but bulky duvets need sufficient washing and drying capacity.","Follow the sewn-in care label and dry thoroughly before storage to prevent musty odours. Professional cleaning may be appropriate for oversized or delicate fills."],["Wedding Gown Cleaning and Storage","Professional Dry Cleaning","wedding-gown-preservation","Address stains as soon as practical after the celebration, including marks that are not immediately visible.","Before long-term storage, ask a specialist to assess lace, beads and layered fabrics. Use archival-quality materials where available and avoid damp storage spaces."],["Laundry Pickup Enquiries in Lagos","Nathans Locations & Services","lagos-laundry-enquiries","For customers in Victoria Island, Nathans provides a direct branch contact for garment-care enquiries.","Describe the items, quantities and preferred collection area to the branch team. Confirm pickup availability and turnaround directly before making arrangements."],["Finding Dry Cleaning Services in Abuja","Nathans Locations & Services","abuja-dry-cleaning","If you need professional garment care around Wuse II, contact the Nathans Abuja team directly.","Share garment types and any special treatment needs. The branch can confirm service suitability, current pricing and timing."],["Professional Garment Care in Port Harcourt","Nathans Locations & Services","port-harcourt-garment-care","Nathans serves customers in Port Harcourt through its GRA Phase 2 branch.","For delicate fabrics, suits and household items, explain the garment construction and any existing stains before requesting a quote."],["Dry Cleaning in Owerri: What to Ask","Nathans Locations & Services","owerri-dry-cleaning-guide","Nathans has two Owerri branches, at MCC Road and New Owerri.","Choose the most convenient branch and confirm garment requirements, current prices, turnaround and any pickup arrangements directly."]];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const params=new URLSearchParams(location.search);const slug=params.get('article');const app=document.getElementById('app');const cats=[...new Set(articles.map(a=>a[1]))];const card=a=>'<a class="card" href="/journal/?article='+encodeURIComponent(a[2])+'"><div class="art" aria-hidden="true">N<span style="color:#e7ca88">.</span></div><div class="card-body"><div class="tag">'+esc(a[1])+'</div><h2>'+esc(a[0])+'</h2><p>'+esc(a[3])+'</p><span class="read">Read article →</span></div></a>';const a=articles.find(x=>x[2]===slug);if(slug&&a){document.title=a[0]+' | Nathans Journal';document.querySelector('meta[name="description"]').content=a[3];document.querySelector('link[rel="canonical"]').href='https://nathansdrycleaners.com/journal/?article='+encodeURIComponent(slug);app.innerHTML='<article class="article"><a href="/journal/">← All articles</a><p class="eyebrow">'+esc(a[1])+'</p><h1>'+esc(a[0])+'</h1><p>'+esc(a[3])+'</p><p>'+esc(a[4])+'</p><div class="cta"><h2>Need expert garment care?</h2><p>Speak with your nearest Nathans branch about your items and current services.</p><a href="/#locations">Find your branch</a></div><h2>More from the Journal</h2><div class="grid">'+articles.filter(x=>x!==a).slice(0,3).map(card).join('')+'</div></article>';const ld=document.createElement('script');ld.type='application/ld+json';ld.textContent=JSON.stringify({'@context':'https://schema.org','@type':'Article',headline:a[0],description:a[3],author:{'@type':'Organization',name:'Nathans Dry Cleaners'},publisher:{'@type':'Organization',name:'Nathans Dry Cleaners'},mainEntityOfPage:location.href});document.head.appendChild(ld)}else{app.innerHTML='<section class="hero"><div class="eyebrow">Since 1997 · Garment care expertise</div><h1>The Nathans Garment Care Journal</h1><p>Thoughtful advice on caring for your clothes, understanding fabrics and finding professional garment care across Nigeria.</p></section><main class="wrap"><div class="controls"><input id="search" type="search" placeholder="Search garment care articles..." aria-label="Search articles"><select id="category" aria-label="Filter category"><option value="">All categories</option>'+cats.map(c=>'<option>'+esc(c)+'</option>').join('')+'</select></div><div id="results" class="grid"></div></main>';const draw=()=>{const q=document.getElementById('search').value.toLowerCase(),c=document.getElementById('category').value;const found=articles.filter(a=>(!c||a[1]===c)&&a.join(' ').toLowerCase().includes(q));document.getElementById('results').innerHTML=found.length?found.map(card).join(''):'<p>No articles match your search.</p>'};document.getElementById('search').addEventListener('input',draw);document.getElementById('category').addEventListener('change',draw);draw()}</script></body></html>
