name: Build journal editorial pages
on:
  push:
    branches: [main, feature/garment-care-journal]
    paths:
      - 'content/journal/**'
      - 'scripts/build_journal.py'
      - 'tests/test_journal_build.py'
      - '.github/workflows/build-journal.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'PyYAML==6.0.2' 'Markdown==3.7' 'bleach==6.2.0'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
      - run: python scripts/build_journal.py
      - name: Commit generated public pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add journal/ sitemap.xml
          if ! git diff --cached --quiet; then
            git commit -m "Build public journal pages from editorial content"
            git push
          fi
